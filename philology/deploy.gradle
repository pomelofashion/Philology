import com.jcminarro.Config

apply plugin: 'maven-publish'

afterEvaluate {
  publishing {
    publications {
      release(MavenPublication) {
        groupId = "com.pomelofashion"
        artifactId = "philology"
        version = "2.0.1"
        artifact("$buildDir/outputs/aar/philology-release.aar")

        pom {
          withXml {
            def dependenciesNode = asNode().appendNode("dependencies")

            project.configurations.implementation.allDependencies.each { dep ->
              if (dep.group != null || dep.version != null || dep.name != "unspecified") {
                def dependencyNode = dependenciesNode.appendNode("dependency")
                dependencyNode.appendNode("groupId", dep.group)
                dependencyNode.appendNode("artifactId", dep.name)
                dependencyNode.appendNode("version", dep.version)
              }
            }
          }
        }
      }
    }

    repositories {
      maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/pomelofashion/mobile-android")
        credentials {
          username = System.getenv("USERNAME")
          password = System.getenv("GH_TOKEN")
        }
      }
    }
  }
}


task sourcesJar(type: Jar) {
  from android.sourceSets.main.java.srcDirs
  archiveClassifier.set("sources")
}